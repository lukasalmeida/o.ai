# =============================================================================
#  _server.cfg — MOCKUP / TEMPLATE (não é carregado pelo servidor)
# -----------------------------------------------------------------------------
#  O servidor carrega apenas "server.cfg". Este arquivo é só referência:
#  copie o que precisar de lá para cá, preencha os placeholders e renomeie.
#
#  Docs: https://docs.fivem.net/docs/server-manual/setting-up-a-server/
#        https://aka.cfx.re/server-commands
# =============================================================================

# -----------------------------------------------------------------------------
# 1. LICENÇA (obrigatório — NUNCA commite a chave real neste arquivo)
# -----------------------------------------------------------------------------
# Gere uma chave em https://keymaster.fivem.net e cole abaixo apenas no
# server.cfg real (que está no .gitignore).
sv_licenseKey "cfxk_SUA_CHAVE_AQUI"

# -----------------------------------------------------------------------------
# 2. IDENTIDADE DO SERVIDOR
# -----------------------------------------------------------------------------
sv_hostname "O.AI | Meu Servidor FiveM"
sets sv_projectName "[FiveM] O.AI"
sets sv_projectDesc "Descrição curta do servidor exibida no launcher."
sets tags "roleplay, brasil, oai"
sets locale "root-AQ"
sets localeCategory "voice"

# -----------------------------------------------------------------------------
# 3. REDE / PORTAS
# -----------------------------------------------------------------------------
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# -----------------------------------------------------------------------------
# 4. PERFORMANCE / LIMITES
# -----------------------------------------------------------------------------
sv_maxclients 48                 # 32 = default, 1024 = license alto
sv_enforceGameBuild 3751         # mp2025_02 - A Safehouse in the Hills
set sv_requestParanoia 2         # proteção contra flood de requests
set sv_maxTimeOut 10000          # ms antes de kickar por timeout

# -----------------------------------------------------------------------------
# 5. SEGURANÇA / ACE (permissões)
# -----------------------------------------------------------------------------
# Regra geral: negar tudo e liberar por exceção.
add_ace builtin.everyone command.list allow
add_ace builtin.everyone command.time allow

# Grupo admin — libera comandos, mas impede sair/desligar
add_ace group.admin command allow
add_ace group.admin command.quit deny
add_ace group.admin command.stop deny

# Admins (substitua pelos seus identifiers)
add_principal identifier.fivem:00000000 group.admin      # SEU_FIVEM_ID
add_principal identifier.discord:000000000000000000 group.admin  # SEU_DISCORD_ID

# Whitelist (descomente para fechar o servidor)
# set sv_populationType "friends"
# set sv_priority none

# -----------------------------------------------------------------------------
# 6. IDENTIFICADORES / INTEGRAÇÕES
# -----------------------------------------------------------------------------
set steam_webApiKey "none"       # cole sua Steam Web API Key p/ identificar Steam IDs
set sv_tebexSecret ""            # webhook/secret do Tebex (loja), se usar
set resources_useSystemChat true

# -----------------------------------------------------------------------------
# 7. VOZ / OneSync (descomente se usar)
# -----------------------------------------------------------------------------
# onesync on
# set voice_chat "enabled"
# set voice_conversationIndicators "enabled"
# set sv_voiceEnabled true

# -----------------------------------------------------------------------------
# 8. LOGS / DIAGNÓSTICO
# -----------------------------------------------------------------------------
set sv_logVersion explicit
# set log_level "info"

# -----------------------------------------------------------------------------
# 9. RECURSOS (ordem de inicialização importa!)
# -----------------------------------------------------------------------------
ensure mapmanager
ensure chat
ensure spawnmanager
ensure basic-gamemode
ensure hardcap
ensure noclip
ensure car
ensure respawn
ensure god

# Recursos do seu servidor (adicione aqui)
# ensure my-scripts
# ensure ox_lib

